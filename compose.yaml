services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: jwt_lesson
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - jwt-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jwt_lesson"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  jwt-postgres:
